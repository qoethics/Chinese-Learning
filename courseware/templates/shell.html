<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
  * { box-sizing: border-box; }

  :root {
    --ink:     #2c2c34;
    --ink-2:   #55555f;
    --ink-3:   #8a8a99;
    --line:    rgba(150,160,180,.28);
    --line-2:  rgba(150,160,180,.45);

    --tone1: #d94a4a;
    --tone2: #cf8500;
    --tone3: #189a58;
    --tone4: #2563d4;
    --tone5: #8a8a99;
  }

  html { scroll-behavior: smooth; }

  body {
    margin: 0;
    padding: 0;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
                 "Noto Sans SC", system-ui, -apple-system, sans-serif;
    color: var(--ink);
    background-color: #eef0f4;
    background-image:
      radial-gradient(circle at 18% -6%,  #ffffff 0%, transparent 44%),
      radial-gradient(circle at 88% 6%,   #f4f6f9 0%, transparent 40%),
      radial-gradient(circle at 50% 108%, #e6e9ef 0%, transparent 52%),
      linear-gradient(180deg, #f8f9fb 0%, #e9ecf1 100%);
    background-attachment: fixed;
    line-height: 1.9;
    -webkit-font-smoothing: antialiased;
  }

  body.menu-open { overflow: hidden; }

  /* ================= ruby 注音 ================= */
  ruby {
    ruby-position: over;
    ruby-align: center;
    margin: 0 .1em;
  }
  rt {
    font-size: .8em;
    letter-spacing: .05em;
    line-height: 1.45;
    font-weight: 600;
    font-family: "Segoe UI", "Helvetica Neue", system-ui, sans-serif;
    color: var(--tone5);
  }
  rt .tone-1 { color: var(--tone1); }
  rt .tone-2 { color: var(--tone2); }
  rt .tone-3 { color: var(--tone3); }
  rt .tone-4 { color: var(--tone4); }
  rt .tone-5 { color: var(--tone5); }

  /* ================= 汉堡按钮 ================= */
  .menu-btn {
    position: fixed;
    top: .85rem;
    left: .85rem;
    z-index: 60;
    width: 44px; height: 44px;
    display: grid;
    place-items: center;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: rgba(255,255,255,.88);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 10px 24px -18px rgba(90,100,120,.95);
    cursor: pointer;
    transition: background .18s ease, transform .18s ease, box-shadow .18s ease;
  }
  .menu-btn:hover {
    background: #fff;
    transform: translateY(-1px);
    box-shadow: 0 14px 28px -18px rgba(90,100,120,1);
  }
  .menu-btn .bars {
    display: block;
    width: 19px;
    height: 13px;
    position: relative;
  }
  .menu-btn .bars i {
    position: absolute;
    left: 0;
    height: 2px;
    width: 100%;
    border-radius: 2px;
    background: linear-gradient(90deg, #7d8494, #5c6472);
    transition: transform .28s ease, opacity .2s ease, top .28s ease;
  }
  .menu-btn .bars i:nth-child(1) { top: 0; }
  .menu-btn .bars i:nth-child(2) { top: 5.5px; }
  .menu-btn .bars i:nth-child(3) { top: 11px; }

  body.menu-open .menu-btn { opacity: 0; pointer-events: none; }

  /* ================= 侧边抽屉 ================= */
  .drawer {
    position: fixed;
    top: 0; left: 0;
    height: 100%;
    width: min(300px, 82vw);
    z-index: 70;
    display: flex;
    flex-direction: column;
    padding: 1.05rem .6rem 1.6rem;
    overflow-y: auto;
    background: linear-gradient(168deg, #f8f9fb 0%, #eef0f4 55%, #e6e9ef 100%);
    border-right: 1px solid var(--line);
    box-shadow: 20px 0 50px -34px rgba(90,100,120,1);
    transform: translateX(-102%);
    transition: transform .34s cubic-bezier(.4,.02,.2,1);
  }
  body.menu-open .drawer { transform: translateX(0); }

  .drawer-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: .15rem .55rem 1rem;
    border-bottom: 1px solid var(--line);
    margin-bottom: .55rem;
  }
  .drawer-head .t {
    font-size: .74rem;
    font-weight: 700;
    letter-spacing: .3em;
    text-indent: .3em;
    color: #7d8494;
  }
  .close-btn {
    width: 32px; height: 32px;
    display: grid;
    place-items: center;
    border: none;
    border-radius: 10px;
    background: rgba(255,255,255,.8);
    color: #8a93a3;
    font-size: 1.2rem;
    line-height: 1;
    cursor: pointer;
    transition: background .16s ease, color .16s ease;
  }
  .close-btn:hover { background: #fff; color: #5c6472; }

  .drawer nav { display: flex; flex-direction: column; gap: .1rem; }

  .drawer .grp {
    margin: .7rem .55rem .25rem;
    font-size: .62rem;
    font-weight: 700;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: #b0b7c2;
    font-family: "Segoe UI", system-ui, sans-serif;
  }

  .drawer a {
    display: flex;
    align-items: baseline;
    gap: .5rem;
    padding: .5rem .7rem;
    border-radius: 11px;
    text-decoration: none;
    color: #55555f;
    font-size: .87rem;
    letter-spacing: .04em;
    transition: background .16s ease, color .16s ease, transform .16s ease;
  }
  .drawer a:hover {
    background: rgba(255,255,255,.9);
    color: #2c2c34;
    transform: translateX(2px);
  }
  .drawer a.sub {
    padding-left: 1.5rem;
    font-size: .82rem;
    color: #6a7280;
  }

  .overlay {
    position: fixed;
    inset: 0;
    z-index: 65;
    background: rgba(60,70,90,.22);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    opacity: 0;
    pointer-events: none;
    transition: opacity .3s ease;
  }
  body.menu-open .overlay { opacity: 1; pointer-events: auto; }

  /* ================= 页面容器 ================= */
  .page {
    max-width: 920px;
    margin: 0 auto;
    padding: 0 1.1rem 5rem;
  }

  /* ================= 顶部 ================= */
  .hero {
    text-align: center;
    padding: 3.8rem 1rem 1.2rem;
  }
  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: .4rem;
    margin-bottom: 1.4rem;
    padding: .42rem .9rem;
    border-radius: 99px;
    background: rgba(255,255,255,.8);
    border: 1px solid var(--line);
    text-decoration: none;
    font-size: .78rem;
    letter-spacing: .1em;
    color: #55555f;
    font-family: "Segoe UI", system-ui, sans-serif;
    transition: background .18s ease, transform .18s ease,
                border-color .18s ease, color .18s ease;
  }
  .back-btn:hover {
    background: #fff;
    transform: translateY(-1px);
    border-color: var(--line-2);
    color: #2c2c34;
  }
  .back-btn .arrow { font-size: .9rem; }

  .hero h1 {
    margin: 0 0 .75rem;
    font-size: clamp(1.9rem, 6vw, 2.7rem);
    font-weight: 700;
    letter-spacing: .16em;
    text-indent: .16em;
    background: linear-gradient(115deg,
      #7d8494 0%, #c3cad6 22%, #5c6472 46%,
      #c3cad6 70%, #7d8494 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    text-shadow: 0 1px 0 rgba(255,255,255,.6);
  }
  .hero .sub {
    margin: 0;
    font-size: .72rem;
    letter-spacing: .34em;
    text-indent: .34em;
    text-transform: uppercase;
    color: #9aa1b0;
    font-family: "Segoe UI", system-ui, sans-serif;
  }
  .ribbon {
    display: flex;
    height: 5px;
    width: 260px;
    max-width: 70%;
    margin: 1.5rem auto 0;
    border-radius: 99px;
    overflow: hidden;
    opacity: .9;
  }
  .ribbon span { flex: 1; }

  .legend {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: .45rem .95rem;
    margin: 1.7rem auto 0;
    padding: .7rem 1.1rem;
    max-width: 560px;
    border-radius: 14px;
    background: rgba(255,255,255,.72);
    border: 1px solid var(--line);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    font-size: .76rem;
    color: var(--ink-2);
  }
  .legend b {
    font-weight: 700;
    font-family: "Segoe UI", system-ui, sans-serif;
    margin-right: .25rem;
  }
  .legend .l1 b { color: var(--tone1); }
  .legend .l2 b { color: var(--tone2); }
  .legend .l3 b { color: var(--tone3); }
  .legend .l4 b { color: var(--tone4); }
  .legend .l5 b { color: var(--tone5); }

  /* ================= 一级模块 ================= */
  .section {
    margin-top: 2.6rem;
    scroll-margin-top: 1rem;
  }
  .section-head {
    display: flex;
    align-items: center;
    gap: .7rem;
    padding: .5rem .8rem .5rem .5rem;
    border-radius: 16px;
    background: rgba(255,255,255,.6);
    border: 1px solid transparent;
    cursor: pointer;
    list-style: none;
    -webkit-user-select: none;
    user-select: none;
    transition: background .18s ease, border-color .18s ease;
  }
  .section-head:hover {
    background: #fff;
    border-color: var(--line-2);
  }
  .section-head::-webkit-details-marker { display: none; }
  .section-head::marker { content: ""; }

  details.section[open] > .section-head { margin-bottom: 1rem; }

  .section-num {
    flex: none;
    width: 34px; height: 34px;
    border-radius: 12px;
    display: grid; place-items: center;
    font-size: .86rem;
    font-weight: 700;
    color: #fff;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: linear-gradient(135deg, #b8c0cc, #7e8b9e);
    box-shadow: 0 8px 16px -8px rgba(120,130,150,.9);
  }
  .section-head h2 {
    margin: 0;
    font-size: 1.18rem;
    font-weight: 700;
    letter-spacing: .1em;
    color: #3a3a44;
  }
  .section-head .en {
    margin-left: auto;
    font-size: .66rem;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: #a8aeba;
    font-family: "Segoe UI", system-ui, sans-serif;
  }
  .section-head::after {
    content: "";
    flex: none;
    width: .44rem;
    height: .44rem;
    margin: -.24rem .35rem 0 .5rem;
    border-right: 2px solid #b0b7c2;
    border-bottom: 2px solid #b0b7c2;
    border-radius: 1px;
    transform: rotate(45deg);
    transition: transform .25s ease, border-color .2s ease;
  }
  details.section[open] > .section-head::after {
    transform: rotate(-135deg);
    margin-top: .1rem;
    border-color: #5c6472;
  }

  /* 控制按钮行 */
  .controls {
    display: flex;
    gap: .5rem;
    margin: .2rem 0 1rem;
    flex-wrap: wrap;
  }
  .ctrl-btn {
    padding: .38rem .85rem;
    border-radius: 99px;
    background: rgba(255,255,255,.85);
    border: 1px solid var(--line);
    color: #55555f;
    font-size: .76rem;
    letter-spacing: .08em;
    font-family: inherit;
    cursor: pointer;
    transition: background .16s ease, color .16s ease,
                border-color .16s ease, transform .16s ease;
  }
  .ctrl-btn:hover {
    background: #fff;
    border-color: var(--line-2);
    color: #2c2c34;
    transform: translateY(-1px);
  }
  .ctrl-btn.copied {
    background: #2c2c34;
    border-color: #2c2c34;
    color: #fff;
  }

  /* ================= 单词分组 ================= */
  .group {
    margin-bottom: .85rem;
    border-radius: 16px;
    background: rgba(255,255,255,.78);
    border: 1px solid var(--line);
    box-shadow: 0 10px 26px -24px rgba(90,100,120,.9);
    overflow: hidden;
    transition: box-shadow .2s ease, border-color .2s ease;
  }
  .group[open] { box-shadow: 0 16px 34px -24px rgba(90,100,120,1); }
  .group:hover { border-color: var(--line-2); }

  .group-head {
    display: flex;
    align-items: center;
    gap: .65rem;
    padding: .7rem 1rem .7rem .85rem;
    cursor: pointer;
    list-style: none;
    -webkit-user-select: none;
    user-select: none;
    transition: background .16s ease;
  }
  .group-head:hover { background: rgba(246,248,251,.9); }
  .group-head::-webkit-details-marker { display: none; }
  .group-head::marker { content: ""; }

  .group-head .bar {
    flex: none;
    width: 4px;
    height: 1.1em;
    border-radius: 3px;
    background: linear-gradient(180deg, #cfd6e2, #7e8b9e);
  }
  .group-head h3 {
    margin: 0;
    font-size: .96rem;
    font-weight: 700;
    letter-spacing: .1em;
    color: #3a3a44;
  }
  .group-head .en {
    margin-left: auto;
    font-size: .64rem;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: #a8aeba;
    font-family: "Segoe UI", system-ui, sans-serif;
  }
  .group-head::after {
    content: "";
    flex: none;
    width: .38rem;
    height: .38rem;
    margin: -.2rem .1rem 0 .5rem;
    border-right: 2px solid #b0b7c2;
    border-bottom: 2px solid #b0b7c2;
    transform: rotate(45deg);
    transition: transform .25s ease, border-color .2s ease;
  }
  details.group[open] > .group-head::after {
    transform: rotate(-135deg);
    margin-top: .12rem;
    border-color: #5c6472;
  }

  .group-body { padding: 0 .9rem .9rem; }

  /* ================= 单词卡 ================= */
  .words {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: .55rem .65rem;
  }

  .word {
    border-radius: 13px;
    background: #fff;
    border: 1px solid var(--line);
    overflow: hidden;
    transition: border-color .18s ease, box-shadow .18s ease;
  }
  .word:hover { border-color: var(--line-2); }
  .word[open] {
    border-color: rgba(120,130,150,.5);
    box-shadow: 0 12px 26px -20px rgba(90,100,120,.9);
  }

  .word > summary {
    display: flex;
    align-items: center;
    gap: .5rem;
    padding: .55rem .8rem;
    cursor: pointer;
    list-style: none;
    -webkit-user-select: none;
    user-select: none;
    transition: background .16s ease;
  }
  .word > summary:hover { background: rgba(246,248,251,.9); }
  .word > summary::-webkit-details-marker { display: none; }
  .word > summary::marker { content: ""; }

  .word .zh {
    flex: 1 1 auto;
    min-width: 0;
    font-size: 1.04rem;
    font-weight: 600;
    line-height: 2.55;
    letter-spacing: .02em;
  }
  .word > summary .sign {
    flex: none;
    width: 20px; height: 20px;
    display: grid;
    place-items: center;
    border-radius: 7px;
    background: #f0f2f6;
    border: 1px solid var(--line);
    color: #9aa1b0;
    font-size: .82rem;
    line-height: 1;
    font-family: "Segoe UI", system-ui, sans-serif;
    transition: background .18s ease, color .18s ease,
                transform .22s ease, border-color .18s ease;
  }
  .word > summary .sign::before { content: "+"; }
  .word[open] > summary .sign {
    background: #2c2c34;
    border-color: #2c2c34;
    color: #fff;
    transform: rotate(180deg);
  }
  .word[open] > summary .sign::before { content: "−"; }

  .word-body {
    padding: .15rem .85rem .75rem;
    border-top: 1px dashed var(--line);
    animation: reveal .24s ease both;
  }
  @keyframes reveal {
    from { opacity: 0; transform: translateY(-3px); }
    to   { opacity: 1; transform: none; }
  }

  .word-en {
    margin: .5rem 0 .3rem;
    font-size: .78rem;
    line-height: 1.5;
    color: #6a7280;
    font-family: "Segoe UI", system-ui, sans-serif;
  }
  .word-en .tag {
    display: inline-block;
    margin-right: .45rem;
    padding: .05rem .45rem;
    border-radius: 6px;
    background: #eef0f4;
    border: 1px solid var(--line);
    font-size: .66rem;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: #8a93a3;
  }

  .word-ex {
    margin: .5rem 0 0;
    padding: .55rem .8rem .6rem;
    border-radius: 11px;
    background: #f7f9fb;
    border: 1px solid rgba(150,160,180,.2);
    position: relative;
  }
  .word-ex::before {
    content: "例";
    position: absolute;
    top: .55rem; left: .8rem;
    font-size: .62rem;
    font-weight: 700;
    color: #b0b7c2;
    font-family: "Segoe UI", system-ui, sans-serif;
  }
  .word-ex .ex-zh {
    margin: 0 0 0 1.1rem;
    font-size: .96rem;
    line-height: 2.6;
    color: #34343e;
  }
  .word-ex .ex-en {
    margin: .15rem 0 0 1.1rem;
    font-size: .74rem;
    line-height: 1.5;
    color: #8a93a3;
    font-family: "Segoe UI", system-ui, sans-serif;
  }

  /* ================= 原文 ================= */
  .original-card {
    padding: 1.4rem 1.5rem;
    border-radius: 18px;
    background: rgba(255,255,255,.9);
    border: 1px solid var(--line);
    box-shadow: 0 12px 32px -26px rgba(90,100,120,.9);
  }
  .original-card p {
    margin: 0 0 1rem;
    font-size: 1.02rem;
    line-height: 2.9;
    color: #34343e;
    letter-spacing: .01em;
  }
  .original-card p:last-child { margin-bottom: 0; }

  mark.hl {
    background: #fff3b0;
    color: inherit;
    padding: 0 .08em;
    border-radius: 3px;
    box-decoration-break: clone;
    -webkit-box-decoration-break: clone;
  }

  /* 可点击抄词 */
  .pickable {
    cursor: pointer;
    border-radius: 4px;
    padding: 0 .08em;
    transition: background .15s ease, box-shadow .15s ease;
  }
  .pickable:hover {
    background: rgba(37,99,212,.14);
    box-shadow: 0 0 0 2px rgba(37,99,212,.12);
  }
  .pickable.picked {
    background: rgba(24,154,88,.18);
    box-shadow: 0 0 0 2px rgba(24,154,88,.16);
  }
  /* 已抄录的词：与硬设置高亮（mark.hl）一致 —— 淡黄高亮 + 同样的注音格式 */
  .pickable.shown {
    background: #fff3b0;
    box-shadow: none;
    border-radius: 3px;
  }
  .pickable.shown ruby { ruby-position: over; }
  .pickable.shown rt {
    font-size: .8em;
    letter-spacing: .05em;
    line-height: 1.45;
    font-weight: 600;
    font-family: "Segoe UI", "Helvetica Neue", system-ui, sans-serif;
    color: var(--tone5);
  }
  .pickable.shown rt .tone-1 { color: var(--tone1); }
  .pickable.shown rt .tone-2 { color: var(--tone2); }
  .pickable.shown rt .tone-3 { color: var(--tone3); }
  .pickable.shown rt .tone-4 { color: var(--tone4); }
  .pickable.shown rt .tone-5 { color: var(--tone5); }

  /* ================= 浮动单词表 ================= */
  .word-tray {
    position: fixed;
    right: 1rem;
    bottom: 1rem;
    z-index: 80;
    width: min(330px, 88vw);
    max-height: min(62vh, 560px);
    display: flex;
    flex-direction: column;
    border-radius: 18px;
    background: rgba(255,255,255,.96);
    border: 1px solid var(--line-2);
    box-shadow: 0 24px 60px -30px rgba(60,70,90,1);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    overflow: hidden;
    transform: translateY(14px);
    opacity: 0;
    pointer-events: none;
    transition: transform .28s ease, opacity .28s ease;
  }
  .word-tray.show {
    transform: translateY(0);
    opacity: 1;
    pointer-events: auto;
  }
  .tray-head {
    display: flex;
    align-items: center;
    gap: .5rem;
    padding: .6rem .8rem;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, #fbfcfe, #f2f4f8);
  }
  .tray-head .ttl {
    font-size: .84rem;
    font-weight: 700;
    letter-spacing: .08em;
    color: #3a3a44;
  }
  .tray-head .cnt {
    font-size: .68rem;
    font-family: "Segoe UI", system-ui, sans-serif;
    color: #fff;
    background: linear-gradient(135deg, #b8c0cc, #7e8b9e);
    border-radius: 99px;
    padding: .05rem .5rem;
    font-weight: 700;
  }
  .tray-head .spacer { margin-left: auto; }
  .tray-btn {
    border: 1px solid var(--line);
    background: #fff;
    color: #55555f;
    font-size: .72rem;
    font-family: inherit;
    letter-spacing: .06em;
    padding: .28rem .6rem;
    border-radius: 9px;
    cursor: pointer;
    transition: background .16s ease, color .16s ease, border-color .16s ease;
  }
  .tray-btn:hover { background: #f4f6fa; border-color: var(--line-2); color: #2c2c34; }
  .tray-btn.copied { background: #2c2c34; border-color: #2c2c34; color: #fff; }
  .tray-btn.icon { padding: .28rem .5rem; }

  .tray-body {
    overflow-y: auto;
    padding: .55rem .6rem .7rem;
  }
  .tray-empty {
    padding: 1rem .6rem;

  </div>

<!-- ==================== pinyin-pro 库 ==================== -->
<script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3/dist/index.js"></script>

<script>
(function () {
  /* ================= 声调着色 ================= */
  var toneMap = {
    '1': 'āēīōūǖĀĒĪŌŪǕ',
    '2': 'áéíóúǘÁÉÍÓÚǗ',
    '3': 'ǎěǐǒǔǚǍĚǏǑǓǙ',
    '4': 'àèìòùǜÀÈÌÒÙǛ'
  };

  function detectTone(syllable) {
    if (!/[a-zA-ZüÜ]/.test(syllable)) return null;
    for (var t in toneMap) {
      var chars = toneMap[t];
      for (var i = 0; i < syllable.length; i++) {
        if (chars.indexOf(syllable[i]) !== -1) return t;
      }
    }
    return '5';
  }

  /* ================= 自动注音：把 .py 元素转成 ruby ================= */
  function makeRuby(word) {
    var pinyinArr = pinyinPro.pinyin(word, { toneType: 'symbol', type: 'array' });
    var chars = word.split('');
    var html = '';
    for (var i = 0; i < chars.length; i++) {
      var py = pinyinArr[i] || '';
      var tone = detectTone(py);
      var cls = tone ? 'tone-' + tone : '';
      html += '<ruby>' + chars[i] +
              '<rt><span class="' + cls + '">' + py + '</span></rt></ruby>';
    }
    return html;
  }

  /* 返回纯文本拼音（空格分隔），用于抄词本。非汉字按原样保留。 */
  function pinyinText(word) {
    var arr = pinyinPro.pinyin(word, { toneType: 'symbol', type: 'array' });
    return arr.join(' ').trim();
  }

  function autoAnnotate() {
    document.querySelectorAll('.py').forEach(function (el) {
      if (el.dataset.pyDone) return;
      el.dataset.pyDone = '1';
      var text = el.textContent.trim();
      if (!text) return;
      if (/^[\u4e00-\u9fa5]+$/.test(text)) {
        el.innerHTML = makeRuby(text);
      }
    });

    // mark.hl 中的纯汉字也自动注音
    document.querySelectorAll('mark.hl').forEach(function (el) {
      if (el.dataset.pyDone) return;
      el.dataset.pyDone = '1';
      var text = el.textContent.trim();
      if (/^[\u4e00-\u9fa5]+$/.test(text)) {
        el.innerHTML = makeRuby(text);
      }
    });
  }

  autoAnnotate();

  /* ================= 抽屉开关 ================= */
  var body     = document.body;
  var menuBtn  = document.getElementById('menuBtn');
  var closeBtn = document.getElementById('closeBtn');
  var overlay  = document.getElementById('overlay');
  var drawer   = document.getElementById('drawer');

  function openMenu() {
    body.classList.add('menu-open');
    menuBtn.setAttribute('aria-expanded', 'true');
    drawer.setAttribute('aria-hidden', 'false');
  }
  function closeMenu() {
    body.classList.remove('menu-open');
    menuBtn.setAttribute('aria-expanded', 'false');
    drawer.setAttribute('aria-hidden', 'true');
  }

  menuBtn.addEventListener('click', openMenu);
  closeBtn.addEventListener('click', closeMenu);
  overlay.addEventListener('click', closeMenu);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { closeMenu(); closeTray(); }
  });

  /* ================= 目录跳转 ================= */
  drawer.querySelectorAll('a[href^="#"]').forEach(function (a) {
    a.addEventListener('click', function (e) {
      e.preventDefault();
      var id = a.getAttribute('href').slice(1);
      var target = document.getElementById(id);
      if (!target) return;
      if (target.tagName === 'DETAILS') target.open = true;
      var p = target.parentElement;
      while (p) {
        if (p.tagName === 'DETAILS') p.open = true;
        p = p.parentElement;
      }
      closeMenu();
      setTimeout(function () {
        target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }, 90);
    });
  });

  /* ================= 单词分组：全体展开 / 折叠 ================= */
  var expandBtn = document.getElementById('expandAll');
  var collapseBtn = document.getElementById('collapseAll');
  if (expandBtn) {
    expandBtn.addEventListener('click', function () {
      document.querySelectorAll('#sec-vocab .group').forEach(function (g) { g.open = true; });
    });
  }
  if (collapseBtn) {
    collapseBtn.addEventListener('click', function () {
      document.querySelectorAll('#sec-vocab .group').forEach(function (g) { g.open = false; });
    });
  }

  /* ================= 复制全部单词 ================= */
  var copyBtn = document.getElementById('copyWordsBtn');

  function buildWordText() {
    var lines = [];
    document.querySelectorAll('#sec-vocab .group').forEach(function (group) {
      var h3 = group.querySelector('.group-head h3');
      if (h3) lines.push(h3.textContent.trim());

      var words = [];
      group.querySelectorAll('.word .zh').forEach(function (zh) {
        var clone = zh.cloneNode(true);
        clone.querySelectorAll('rt, rp').forEach(function (n) { n.remove(); });
        var text = clone.textContent.replace(/\s+/g, '').trim();
        if (text) words.push(text);
      });
      lines.push(words.join('　'));
      lines.push('');
    });
    return lines.join('\n').trim();
  }

  if (copyBtn) {
    copyBtn.addEventListener('click', function () {
      var text = buildWordText();
      function done() {
        copyBtn.classList.add('copied');
        copyBtn.textContent = '已复制 ✓';
        setTimeout(function () {
          copyBtn.classList.remove('copied');
          copyBtn.textContent = '复制单词 · Copy';
        }, 1800);
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done).catch(function () {
          fallbackCopy(text, done);
        });
      } else {
        fallbackCopy(text, done);
      }
    });
  }

  function fallbackCopy(text, cb) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); cb(); } catch (e) {}
    document.body.removeChild(ta);
  }

  /* ================= 原文抄词功能 ================= */
  var originalBody = document.getElementById('originalBody');
  var tray       = document.getElementById('wordTray');
  var trayBody   = document.getElementById('trayBody');
  var trayCount  = document.getElementById('trayCount');
  var trayBadge  = document.getElementById('trayBadge');
  var trayToggle = document.getElementById('trayToggle');
  var trayCopy   = document.getElementById('trayCopyBtn');
  var trayClear  = document.getElementById('trayClearBtn');
  var trayClose  = document.getElementById('trayCloseBtn');

  var pickedWords = [];

  /* 中文分词：优先用 Intl.Segmenter，缺失时退回正则。
     返回 [{text, isWord}]，其中 isWord 为 true 的片段才可点选。 */
  var zhSegmenter = (typeof Intl !== 'undefined' && Intl.Segmenter)
    ? new Intl.Segmenter('zh', { granularity: 'word' })
    : null;

  function segmentText(text) {
    var out = [];
    if (zhSegmenter) {
      for (var s of zhSegmenter.segment(text)) {
        // isWordLike 会把标点、空格等归为 false
        out.push({ text: s.segment, isWord: s.isWordLike });
      }
      return out;
    }
    // 回退：连续汉字整体切出（旧行为，仅在不支持 Segmenter 的浏览器上使用）
    var last = 0, m, re = /[\u4e00-\u9fa5]{2,}/g;
    while ((m = re.exec(text)) !== null) {
      if (m.index > last) out.push({ text: text.slice(last, m.index), isWord: false });
      out.push({ text: m[0], isWord: true });
      last = m.index + m[0].length;
    }
    if (last < text.length) out.push({ text: text.slice(last), isWord: false });
    return out;
  }

  function wrapPickableWords(root) {
    if (!root) return;
    var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode: function (node) {
        if (!node.nodeValue || !node.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
        if (node.parentElement && node.parentElement.closest('.pickable, rt, rp, ruby')) {
          return NodeFilter.FILTER_REJECT;
        }
        return NodeFilter.FILTER_ACCEPT;
      }
    });

    var textNodes = [];
    while (walker.nextNode()) textNodes.push(walker.currentNode);

    textNodes.forEach(function (node) {
      var text = node.nodeValue;
      var frag = document.createDocumentFragment();
      segmentText(text).forEach(function (seg) {
        if (!seg.text) return;
        if (seg.isWord) {
          var span = document.createElement('span');
          span.className = 'pickable';
          span.textContent = seg.text;
          frag.appendChild(span);
        } else {
          frag.appendChild(document.createTextNode(seg.text));
        }
      });
      if (frag.childNodes.length) {
        node.parentNode.replaceChild(frag, node);
      }
    });
  }

  wrapPickableWords(originalBody);

  /* 在原文里给一个词加上拼音（ruby），并标记为已显示。 */
  function showPinyinInPlace(span) {
    if (!span || span.dataset.pyShown) return;
    var word = span.textContent.trim();
    if (!word) return;
    span.dataset.pyShown = '1';
    span.dataset.origText = word;
    span.innerHTML = makeRuby(word);
    span.classList.add('shown');
  }

  /* 移除原文中某个词的拼音，恢复为纯文字。 */
  function hidePinyinInPlace(span) {
    if (!span || !span.dataset.pyShown) return;
    var word = span.dataset.origText || span.textContent.trim();
    delete span.dataset.pyShown;
    delete span.dataset.origText;
    span.classList.remove('shown');
    span.textContent = word;
  }

  /* 取一个词条的真实文字（已注音时 textContent 会含拼音，故优先用 origText）。 */
  function wordOf(span) {
    return (span.dataset.origText || span.textContent).trim();
  }

  if (originalBody) {
    originalBody.addEventListener('click', function (e) {
      var span = e.target.closest('.pickable');
      if (!span) return;
      var word = wordOf(span);
      if (!word) return;

      var at = pickedWords.indexOf(word);
      if (at === -1) {
        // 加入抄词本，并在原文就地显示拼音
        pickedWords.push(word);
        showPinyinInPlace(span);
      } else {
        // 再次点击：从抄词本移除，并撤下原文拼音
        pickedWords.splice(at, 1);
        hidePinyinInPlace(span);
      }
      renderTray();

      span.classList.add('picked');
      setTimeout(function () { span.classList.remove('picked'); }, 700);
    });
  }

  function renderTray() {
    if (!trayBody) return;
    trayBody.innerHTML = '';
    if (pickedWords.length === 0) {
      var empty = document.createElement('div');
      empty.className = 'tray-empty';
      empty.innerHTML = '点击左侧原文中的任意词语，<br>即可把它抄到这里。';
      trayBody.appendChild(empty);
    } else {
      pickedWords.forEach(function (w, i) {
        var item = document.createElement('div');
        item.className = 'tray-item';
        var idx = document.createElement('span');
        idx.className = 'idx';
        idx.textContent = i + 1;
        var txt = document.createElement('span');
        txt.className = 'txt';
        var py = document.createElement('span');
        py.className = 'pyline';
        py.textContent = pinyinText(w);
        var zh = document.createElement('span');
        zh.className = 'zh';
        zh.textContent = w;
        txt.appendChild(py);
        txt.appendChild(zh);
        var del = document.createElement('button');
        del.className = 'del';
        del.setAttribute('aria-label', '删除');
        del.textContent = '✕';
        del.addEventListener('click', function () {
          pickedWords.splice(i, 1);
          renderTray();
          // 原文中所有该词取消注音
          if (originalBody) {
            originalBody.querySelectorAll('.pickable[data-py-shown]').forEach(function (el) {
              if (el.dataset.origText === w) hidePinyinInPlace(el);
            });
          }
        });
        item.appendChild(idx);
        item.appendChild(txt);
        item.appendChild(del);
        trayBody.appendChild(item);
      });
    }
    if (trayCount) trayCount.textContent = pickedWords.length;
    if (trayBadge) trayBadge.textContent = pickedWords.length;
    if (trayToggle) trayToggle.style.display = pickedWords.length > 0 ? '' : 'none';
  }

  function openTray() {
    if (tray) {
      tray.classList.add('show');
      tray.setAttribute('aria-hidden', 'false');
    }
  }
  function closeTray() {
    if (tray) {
      tray.classList.remove('show');
      tray.setAttribute('aria-hidden', 'true');
    }
  }

  if (trayToggle) trayToggle.addEventListener('click', openTray);
  if (trayClose) trayClose.addEventListener('click', closeTray);

  if (trayClear) {
    trayClear.addEventListener('click', function () {
      pickedWords = [];
      renderTray();
      if (originalBody) {
        originalBody.querySelectorAll('.pickable[data-py-shown]').forEach(function (el) {
          hidePinyinInPlace(el);
        });
      }
      document.querySelectorAll('.pickable.picked').forEach(function (el) {
        el.classList.remove('picked');
      });
      closeTray();
    });
  }

  if (trayCopy) {
    trayCopy.addEventListener('click', function () {
      var text = pickedWords.join('\n');
      if (!text) return;
      function done() {
        trayCopy.classList.add('copied');
        trayCopy.textContent = '已复制 ✓';
        setTimeout(function () {
          trayCopy.classList.remove('copied');
          trayCopy.textContent = '复制';
        }, 1600);
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done).catch(function () {
          fallbackCopy(text, done);
        });
      } else {
        fallbackCopy(text, done);
      }
    });
  }

  renderTray();
  if (trayToggle) trayToggle.style.display = 'none';
  closeTray();

})();
</script>

</body>
</html>
