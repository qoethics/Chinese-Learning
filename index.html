<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chinese Practice</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
                 "Noto Sans SC", system-ui, -apple-system, sans-serif;
    color: #3f3d4d;
    background-color: #fdfbff;
    background-image:
      radial-gradient(circle at 6% -4%,   #ffe3ee 0%, transparent 42%),
      radial-gradient(circle at 96% 4%,   #e7e1ff 0%, transparent 40%),
      radial-gradient(circle at 50% 104%, #ddfaf0 0%, transparent 46%);
    background-attachment: fixed;
    -webkit-font-smoothing: antialiased;
    padding: 1.5rem;
  }

  .card {
    width: 100%;
    max-width: 380px;
    padding: 2.6rem 2rem 2.2rem;
    border-radius: 24px;
    background: rgba(255,255,255,.88);
    border: 1px solid rgba(160,140,200,.16);
    box-shadow: 0 24px 60px -36px rgba(120,100,170,.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    text-align: center;
  }

  .logo {
    width: 54px;
    height: 54px;
    margin: 0 auto 1.2rem;
    border-radius: 17px;
    display: grid;
    place-items: center;
    font-size: 1.35rem;
    font-weight: 600;
    color: #fff;
    background: linear-gradient(135deg, #ef9cb4, #a793e6);
    box-shadow: 0 14px 28px -14px rgba(167,147,230,.95);
  }

  h1 {
    margin: 0 0 .4rem;
    font-size: 1.35rem;
    font-weight: 600;
    letter-spacing: .14em;
    text-indent: .14em;
    background: linear-gradient(100deg, #ef9cb4 0%, #a793e6 48%, #6fc7ab 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
  }

  .sub {
    margin: 0 0 1.9rem;
    font-size: .68rem;
    letter-spacing: .3em;
    text-indent: .3em;
    text-transform: uppercase;
    color: #b3aac9;
    font-family: "Segoe UI", system-ui, sans-serif;
  }

  .field {
    text-align: left;
    margin-bottom: 1rem;
  }
  .field label {
    display: block;
    margin-bottom: .35rem;
    font-size: .72rem;
    letter-spacing: .12em;
    color: #8a83a3;
    font-family: "Segoe UI", system-ui, sans-serif;
  }
  .field input {
    width: 100%;
    padding: .74rem .9rem;
    border-radius: 12px;
    border: 1px solid rgba(160,140,200,.2);
    background: #fcfbff;
    font-size: .95rem;
    font-family: inherit;
    color: #3f3d4d;
    outline: none;
    transition: border-color .18s ease, box-shadow .18s ease, background .18s ease;
  }
  .field input:focus {
    background: #fff;
    border-color: rgba(167,147,230,.55);
    box-shadow: 0 0 0 4px rgba(167,147,230,.12);
  }

  .btn {
    width: 100%;
    margin-top: .55rem;
    padding: .78rem 1rem;
    border: none;
    border-radius: 13px;
    font-size: .92rem;
    font-weight: 600;
    letter-spacing: .14em;
    text-indent: .14em;
    color: #fff;
    cursor: pointer;
    background: linear-gradient(100deg, #ef9cb4, #a793e6 55%, #7ea9e0);
    box-shadow: 0 14px 28px -16px rgba(167,147,230,1);
    transition: transform .18s ease, box-shadow .18s ease, opacity .18s ease;
  }
  .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 18px 34px -16px rgba(167,147,230,1);
  }
  .btn:active { transform: translateY(0); }
  .btn:disabled { opacity: .6; cursor: wait; }

  .msg {
    min-height: 1.3rem;
    margin: .8rem 0 0;
    font-size: .78rem;
    letter-spacing: .04em;
    color: #d94a4a;
    font-family: "Segoe UI", system-ui, sans-serif;
    opacity: 0;
    transition: opacity .2s ease;
  }
  .msg.show { opacity: 1; }

  .footer {
    margin-top: 1.9rem;
    font-size: .66rem;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: #c4bcd8;
    font-family: "Segoe UI", system-ui, sans-serif;
  }

  .nav-links {
    margin-top: 1.35rem;
    display: grid;
    gap: .55rem;
    text-align: left;
  }
  .nav-links a {
    display: flex; align-items: center; gap: .65rem;
    padding: .62rem .85rem;
    border-radius: 12px;
    border: 1px solid rgba(160,140,200,.2);
    background: #fcfbff;
    color: #4a4661;
    text-decoration: none;
    font-size: .82rem;
    font-weight: 600;
    letter-spacing: .04em;
    font-family: "PingFang SC", system-ui, sans-serif;
    transition: transform .18s ease, border-color .18s ease,
                background .18s ease, box-shadow .18s ease;
  }
  .nav-links a:hover {
    transform: translateY(-2px);
    background: #fff;
    border-color: rgba(167,147,230,.45);
    box-shadow: 0 10px 20px -12px rgba(120,100,170,.7);
  }
  .nav-links a:active { transform: translateY(0); }
  .nav-links .nav-ico {
    flex: none; width: 26px; height: 26px;
    border-radius: 8px; display: grid; place-items: center;
    font-size: .72rem; font-weight: 700; color: #fff;
  }
  .nav-links .nav-ico.c1 { background: linear-gradient(135deg, #ef9cb4, #a793e6); }
  .nav-links .nav-ico.c2 { background: linear-gradient(135deg, #7ea9e0, #a793e6); }
  .nav-links .nav-ico.c3 { background: linear-gradient(135deg, #6fc7ab, #7ea9e0); }

  @media (max-width: 420px) {
    .card { padding: 2rem 1.4rem 1.8rem; border-radius: 20px; }
  }
</style>
</head>
<body>

<div class="card">
  <div class="logo">中</div>
  <h1>中文练习</h1>
  <p class="sub">Chinese Practice · Sign in</p>

  <form id="loginForm" autocomplete="off">
    <div class="field">
      <label for="pw">密码 Password</label>
      <input id="pw" type="password" placeholder="请输入密码" required>
    </div>
    <button class="btn" type="submit" id="submitBtn">进入 Enter</button>
    <p class="msg" id="msg">密码不正确，请重试。</p>
  </form>

  <p class="footer">中文练习 · Chinese Practice</p>

  <div class="nav-links">
    <a href="pinyin.html">
      <span class="nav-ico c1">拼</span>
      汉语拼音练习 · Pinyin Practice
    </a>
    <a href="hsk1/index.html">
      <span class="nav-ico c2">H1</span>
      HSK 1
    </a>
    <a href="hsk1-radicals-hanzi.html">
      <span class="nav-ico c3">字</span>
      识字 · 偏旁练习
    </a>
  </div>
</div>

<script>
(function () {
  /*
   * 在这里设置密码和跳转地址。
   * 左边是密码（区分大小写），右边是跳转到的页面。
   */
  var ACCOUNTS = {
    "jessica": "jessica/",
    "winston": "winston/",
    "brad": "brad/",
    "hsk1": "hsk1/"
  };

  var form = document.getElementById('loginForm');
  var pw   = document.getElementById('pw');
  var msg  = document.getElementById('msg');
  var btn  = document.getElementById('submitBtn');

  // 如果本会话已经登录过，直接跳转（记住 12 小时）
  try {
    var saved = JSON.parse(sessionStorage.getItem('study_login') || 'null');
    if (saved && saved.t && Date.now() - saved.t < 12 * 3600 * 1000 && ACCOUNTS[saved.pw]) {
      location.replace(ACCOUNTS[saved.pw]);
      return;
    }
  } catch (e) {}

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    msg.classList.remove('show');
    var value = pw.value.trim();

    if (ACCOUNTS[value]) {
      btn.disabled = true;
      btn.textContent = '进入中…';
      try {
        sessionStorage.setItem('study_login', JSON.stringify({ pw: value, t: Date.now() }));
      } catch (err) {}
      setTimeout(function () {
        location.href = ACCOUNTS[value];
      }, 180);
    } else {
      msg.classList.add('show');
      pw.value = '';
      pw.focus();
      var card = document.querySelector('.card');
      card.animate(
        [
          { transform: 'translateX(0)' },
          { transform: 'translateX(-7px)' },
          { transform: 'translateX(7px)' },
          { transform: 'translateX(-4px)' },
          { transform: 'translateX(4px)' },
          { transform: 'translateX(0)' }
        ],
        { duration: 340, easing: 'ease-in-out' }
      );
    }
  });
})();
</script>

</body>
</html>
