<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<script>
// 部署环境：目录 URL 无尾斜杠时相对链接会丢目录，动态补一个目录 base；本地 file:// 不启用。
if (location.protocol !== 'file:') {
  (function () {
    var p = location.pathname;
    if (!/\/$/.test(p)) {
      p = /\.[^\/]+$/.test(p) ? p.slice(0, p.lastIndexOf('/') + 1) : p + '/';
    }
    var b = document.createElement('base');
    b.href = p;
    document.head.appendChild(b);
  })();
}
</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chinese Practice</title>
<style>
  * { box-sizing: border-box; }
  :root {
    --pink: #ef9cb4; --mint: #6fc7ab; --sky: #7ea9e0;
    --lav: #a793e6; --peach: #f2a882;
    --ink: #3f3d4d; --ink-3: #a49dba;
    --line: rgba(160,140,200,.16);
  }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; padding: 0;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
                 "Noto Sans SC", system-ui, -apple-system, sans-serif;
    color: var(--ink);
    background-color: #fdfbff;
    background-image:
      radial-gradient(circle at 6% -4%,   #ffe3ee 0%, transparent 42%),
      radial-gradient(circle at 96% 4%,   #e7e1ff 0%, transparent 40%),
      radial-gradient(circle at 50% 104%, #ddfaf0 0%, transparent 46%);
    background-attachment: fixed;
    line-height: 1.9;
    -webkit-font-smoothing: antialiased;
  }
  .page { max-width: 880px; margin: 0 auto; padding: 0 1.15rem 5rem; }

  .hero { text-align: center; padding: 4.2rem 1rem 1rem; }
  .hero h1 {
    margin: 0 0 .7rem;
    font-size: clamp(1.9rem, 6vw, 2.7rem);
    font-weight: 600;
    letter-spacing: .18em;
    text-indent: .18em;
    background: linear-gradient(100deg, #ef9cb4 0%, #a793e6 48%, #6fc7ab 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
  }
  .hero .sub {
    margin: 0; font-size: .72rem;
    letter-spacing: .34em; text-indent: .34em;
    text-transform: uppercase; color: #b3aac9;
    font-family: "Segoe UI", system-ui, sans-serif;
  }
  .ribbon {
    display: flex; height: 6px; width: 260px; max-width: 70%;
    margin: 1.5rem auto 0; border-radius: 99px;
    overflow: hidden; opacity: .85;
  }
  .ribbon span { flex: 1; }

  .section { margin-top: 2.8rem; }
  .section-head {
    display: flex; align-items: center; gap: .75rem;
    margin-bottom: 1.15rem;
  }
  .section-num {
    flex: none; width: 34px; height: 34px;
    border-radius: 12px; display: grid; place-items: center;
    font-size: .86rem; font-weight: 700; color: #fff;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: var(--c, #a793e6);
    box-shadow: 0 8px 16px -8px var(--c, #a793e6);
  }
  .section-head h2 {
    margin: 0; font-size: 1.22rem;
    font-weight: 600; letter-spacing: .1em;
  }
  .section-head .en {
    margin-left: auto; font-size: .68rem;
    letter-spacing: .2em; text-transform: uppercase;
    color: #b8b0cc; font-family: "Segoe UI", system-ui, sans-serif;
  }

  .notes { display: grid; gap: .85rem; }
  .note {
    display: flex; align-items: center; gap: 1rem;
    padding: 1.05rem 1.25rem; border-radius: 18px;
    background: rgba(255,255,255,.88);
    border: 1px solid var(--line);
    box-shadow: 0 12px 32px -24px rgba(120,100,170,.6);
    text-decoration: none; color: inherit;
    transition: transform .18s ease, box-shadow .18s ease,
                border-color .18s ease, background .18s ease;
  }
  .note:hover {
    transform: translateY(-3px); background: #fff;
    border-color: rgba(167,147,230,.35);
    box-shadow: 0 18px 36px -24px rgba(120,100,170,.85);
  }
  .note:active { transform: translateY(-1px); }
  .note-icon {
    flex: none; width: 46px; height: 46px;
    border-radius: 14px; display: grid; place-items: center;
    font-size: .95rem; font-weight: 700; color: #fff;
    background: linear-gradient(135deg, var(--pink), var(--lav));
    box-shadow: 0 10px 20px -12px rgba(167,147,230,.95);
  }
  .note-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: .08rem; }
  .note-title {
    font-size: 1.02rem; font-weight: 600;
    letter-spacing: .03em; color: #4a4661; line-height: 1.6;
  }
  .note-desc {
    font-size: .78rem; line-height: 1.5;
    color: var(--ink-3); font-family: "Segoe UI", system-ui, sans-serif;
  }
  .note-arrow {
    flex: none; font-size: 1.1rem; color: #c9c1dd;
    transition: transform .2s ease, color .2s ease;
  }
  .note:hover .note-arrow { transform: translateX(4px); color: var(--lav); }

  .footer {
    margin-top: 3.5rem; text-align: center;
    font-size: .72rem; letter-spacing: .2em;
    text-transform: uppercase; color: #c4bcd8;
    font-family: "Segoe UI", system-ui, sans-serif;
  }
  .footer .switch-account {
    color: #a49dba; text-decoration: none;
    border-bottom: 1px dashed #c9c1dd; cursor: pointer;
    letter-spacing: .05em;
  }
  .footer .switch-account:hover { color: var(--lav); border-bottom-color: var(--lav); }

  .nav-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: .85rem; }
  .nav-item {
    display: flex; flex-direction: column; align-items: center; gap: .55rem;
    padding: 1.1rem .9rem; border-radius: 18px;
    background: rgba(255,255,255,.88);
    border: 1px solid var(--line);
    box-shadow: 0 12px 32px -24px rgba(120,100,170,.6);
    text-decoration: none; color: inherit; text-align: center;
    transition: transform .18s ease, box-shadow .18s ease,
                border-color .18s ease, background .18s ease;
  }
  .nav-item:hover {
    transform: translateY(-3px); background: #fff;
    border-color: rgba(167,147,230,.35);
    box-shadow: 0 18px 36px -24px rgba(120,100,170,.85);
  }
  .nav-item:active { transform: translateY(-1px); }
  .nav-icon {
    width: 42px; height: 42px;
    border-radius: 13px; display: grid; place-items: center;
    font-size: .95rem; font-weight: 700; color: #fff;
    background: linear-gradient(135deg, var(--pink), var(--lav));
    box-shadow: 0 10px 20px -12px rgba(167,147,230,.95);
  }
  .nav-icon.c1 { background: linear-gradient(135deg, #ef9cb4, #a793e6); }
  .nav-icon.c2 { background: linear-gradient(135deg, #7ea9e0, #a793e6); }
  .nav-icon.c3 { background: linear-gradient(135deg, #6fc7ab, #7ea9e0); }
  .nav-title {
    font-size: .92rem; font-weight: 600;
    letter-spacing: .03em; color: #4a4661; line-height: 1.45;
  }

  @media (max-width: 560px) {
    .hero { padding-top: 3.4rem; }
    .note { padding: .9rem 1rem; gap: .8rem; border-radius: 16px; }
    .note-icon { width: 40px; height: 40px; font-size: .86rem; border-radius: 12px; }
    .note-title { font-size: .96rem; }
    .note-desc { font-size: .74rem; }
    .nav-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

  <section class="section">

    <div class="notes">

      <a class="note" href="./brad1.html">

  <p class="footer">Brad · Classroom Chinese · <a href="#" class="switch-account" id="switchAccount">Switch Account</a></p>
</div>
<script>
document.getElementById('switchAccount').addEventListener('click', function (e) {
  e.preventDefault();
  try { sessionStorage.removeItem('study_login'); } catch (err) {}
  var p = location.pathname.split('/');
  p.pop(); p.pop(); p.push('index.html');
  location.href = p.join('/');
});
</script>

</html>
